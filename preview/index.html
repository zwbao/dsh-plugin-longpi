<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LongPi 预览</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
  /* DSH design tokens (dsh-client-ui-theme 0.1.5), light on body, dark on body[data-ds-dark-theme]. */
  body {
    --dsw-alias-bg-base: #fff; --dsw-alias-bg-layer-1: #fff; --dsw-alias-bg-layer-2: #fff; --dsw-alias-bg-layer-3: #fff;
    --dsw-alias-label-primary: rgb(15, 17, 21); --dsw-alias-label-secondary: rgb(97, 102, 107); --dsw-alias-label-tertiary: rgb(129, 133, 140); --dsw-alias-label-caption: rgb(173, 178, 184);
    --dsw-alias-border-l1: rgba(0, 0, 0, .04); --dsw-alias-border-l2: rgba(0, 0, 0, .1); --dsw-alias-border-l3: rgba(0, 0, 0, .12); --dsw-alias-border-l4: rgba(0, 0, 0, .16);
    --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, .06); --dsw-alias-interactive-bg-active: rgba(38, 49, 72, .1);
    --dsw-alias-state-success-primary: rgb(34, 197, 94); --dsw-alias-state-success-secondary: rgb(78, 209, 126);
    --dsw-alias-state-warn-primary: rgb(245, 158, 11); --dsw-alias-state-error-primary: rgb(236, 19, 19);
    --dsw-alias-state-business-primary: rgb(65, 118, 230); --dsw-alias-state-business-tertiary: #e8efff;
    --dsw-alias-bg-skeleton: rgba(0, 0, 0, .04); --dsw-alias-brand-primary: rgb(15, 17, 21);
    --dsw-alias-button-primary-fill: var(--dsw-alias-brand-primary); --dsw-alias-button-primary-hover: #43454a; --dsw-alias-label-primary-foreground: #fff;
    --dsw-alias-bg-mask-1: rgba(0, 0, 0, .24); --dsw-mask-blur: blur(2px);
    --dsw-specific-sidebar-fill: #f9fafb; --dsw-specific-input-major: #fff;
    --dsw-elevation-stroke-color: var(--dsw-alias-border-l4); --dsw-elevation-stroke: 0 0 0 .5px var(--dsw-elevation-stroke-color);
    --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 #0000000a, 0 0 20px 0 #0000000d;
    --dsw-elevation-soft: var(--dsw-elevation-stroke), 0 4px 16px 0 #00000008, 0 0 24px 0 #00000008;
    --dsw-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ds-font-family-code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --dsh-composer-card-max-width: 744px; --dsh-composer-side-clearance: 16px;
  }
  body[data-ds-dark-theme] {
    --dsw-alias-bg-base: rgb(21, 21, 23); --dsw-alias-bg-layer-1: rgb(35, 35, 36); --dsw-alias-bg-layer-2: rgb(44, 44, 46); --dsw-alias-bg-layer-3: rgb(53, 54, 56);
    --dsw-alias-label-primary: rgb(249, 250, 251); --dsw-alias-label-secondary: rgb(207, 211, 214); --dsw-alias-label-tertiary: rgb(173, 178, 184); --dsw-alias-label-caption: rgb(129, 133, 140);
    --dsw-alias-border-l1: rgba(255, 255, 255, .06); --dsw-alias-border-l2: rgba(255, 255, 255, .12); --dsw-alias-border-l3: rgba(255, 255, 255, .16); --dsw-alias-border-l4: rgba(255, 255, 255, .2);
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .08); --dsw-alias-interactive-bg-active: rgba(255, 255, 255, .14);
    --dsw-alias-state-error-primary: rgb(242, 90, 90); --dsw-alias-state-business-primary: rgb(103, 158, 254); --dsw-alias-state-business-tertiary: #1e2a44;
    --dsw-alias-bg-skeleton: rgba(255, 255, 255, .08); --dsw-alias-brand-primary: rgb(249, 250, 251);
    --dsw-alias-button-primary-hover: #ebeef2; --dsw-alias-label-primary-foreground: rgb(15, 17, 21);
    --dsw-alias-bg-mask-1: rgba(0, 0, 0, .5);
    --dsw-specific-sidebar-fill: #1b1b1c; --dsw-specific-input-major: rgb(44, 44, 46);
  }
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: var(--dsw-font-family); background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); font-size: 14px; }

  /* Stand-ins for @deepseek-ai/dsh-client-ui-primitives (geometry copied from its CSS modules). */
  .dshp-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .dshp-mask { position: absolute; inset: 0; background: var(--dsw-alias-bg-mask-1); backdrop-filter: var(--dsw-mask-blur); }
  .dshp-dialog { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 20px; width: min(380px, 100%); padding: 0 0 24px; overflow: hidden; border-radius: 24px; background: var(--dsw-alias-bg-layer-2); box-shadow: var(--dsw-elevation-prominent); }
  .dshp-button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: none; border-radius: 18px; cursor: pointer; font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-primary); background: transparent; padding: 0 14px; font-family: inherit; }
  .dshp-button:disabled { cursor: not-allowed; opacity: .4; }
  .dshp-md { height: 36px; }
  .dshp-sm { height: 28px; font-size: 12px; line-height: 18px; padding: 0 10px; border-radius: 14px; }
  .dshp-primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
  .dshp-primary:hover:not(:disabled) { background: var(--dsw-alias-button-primary-hover); }
  .dshp-ghost:hover:not(:disabled), .dshp-outline:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
  .dshp-outline { border: .5px solid var(--dsw-alias-border-l3); }

  /* A rough DSH frame around each seat, so layout problems show up. */
  .pv-frame { display: flex; height: 100%; }
  .pv-sidebar { width: 240px; flex: none; background: var(--dsw-specific-sidebar-fill); border-right: .5px solid var(--dsw-alias-border-l3); padding: 52px 12px 12px; box-sizing: border-box; font-size: 14px; }
  .pv-side-row { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--dsw-alias-label-primary); }
  .pv-side-row.on { background: var(--dsw-alias-interactive-bg-active); font-weight: 500; }
  .pv-side-title { margin: 18px 10px 6px; font-size: 12px; color: var(--dsw-alias-label-tertiary); }
  .pv-side-session { height: 32px; display: flex; align-items: center; padding: 0 10px; color: var(--dsw-alias-label-secondary); font-size: 13px; }
  .pv-main { flex: 1; min-width: 0; position: relative; overflow: hidden; background: var(--dsw-alias-bg-base); }
  .pv-overlay { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .pv-overlay > * { pointer-events: auto; }
  /* DSH's conversation root around the composer (dsh-client-ui-conversation 0.1.5: ConversationRoot,
     HeroShell and InputBar CSS modules, geometry copied). The hero phase centres the composer seat. */
  .pv-conv { height: 100%; min-width: 0; display: flex; flex-direction: column; background: var(--dsw-alias-bg-base); }
  .pv-scroll { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .pv-conv[data-phase=hero] .pv-scroll { justify-content: center; }
  .pv-composer-seat { flex: none; display: flex; flex-direction: column; }
  .pv-composer-stack { --dsh-composer-stack-gap: 6px; gap: var(--dsh-composer-stack-gap); display: flex; flex-direction: column; }
  .pv-composer-hero { width: min(calc(var(--dsh-composer-card-max-width) + 2 * var(--dsh-composer-side-clearance)), 100%); z-index: 1; align-self: center; gap: 8px; padding-bottom: 32px; }
  .pv-hero-root { display: flex; justify-content: center; align-items: center; min-width: 0; height: 100%; padding: 0 24px; }
  .pv-stack { width: 100%; max-width: var(--dsh-composer-card-max-width); display: flex; flex-direction: column; align-items: stretch; gap: 12px; overflow: visible; }
  .pv-headline { color: var(--dsw-alias-label-primary); flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 10px; font-size: 26px; font-weight: 500; line-height: 32px; display: flex; }
  .pv-fish { flex: none; justify-content: center; align-items: center; display: inline-flex; }
  .pv-title { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 7px; min-width: 0; }
  .pv-hero-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; position: relative; }
  .pv-badge { border: .5px solid var(--dsw-alias-interactive-bg-hover); background: var(--dsw-alias-state-business-tertiary); color: var(--dsw-alias-state-business-primary); font-family: var(--ds-font-family-code); border-radius: 24px; align-self: flex-start; margin-top: 2px; padding: 1px 7px 0; font-size: 12px; font-weight: 500; line-height: 18px; }
  .pv-workspace-row { display: flex; align-items: center; gap: 2px; min-width: 0; margin-top: 4px; padding: 0 16px 0 20px; }
  .pv-workspace { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; max-width: min(100%, 360px); padding: 0 8px; border: 0; border-radius: 16px; background: transparent; color: var(--dsw-alias-label-primary); font: 500 13px/20px var(--dsw-font-family); cursor: pointer; }
  .pv-workspace:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .pv-workspace-caret { color: var(--dsw-alias-label-caption); font-size: 10px; }
  .pv-preset { height: 28px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 16px; font-size: 13px; color: var(--dsw-alias-label-secondary); }
  .pv-inputbar { padding: 0 var(--dsh-composer-side-clearance) 8px; display: flex; flex-direction: column; align-items: center; }
  .pv-inputbar-hero { padding: 0 var(--dsh-composer-side-clearance); }
  .pv-composer { box-sizing: border-box; width: 100%; max-width: var(--dsh-composer-card-max-width); background: var(--dsw-specific-input-major); box-shadow: 0 0 0 .5px var(--dsw-alias-border-l2), 0 4px 16px #00000008, 0 0 24px #00000008; border-radius: 22px; padding: 14px 16px 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; }
  .pv-composer-text { font-size: 14px; line-height: 24px; color: var(--dsw-alias-label-primary); min-height: 24px; white-space: pre-wrap; }
  .pv-composer-text:empty::before { content: attr(data-placeholder); color: var(--dsw-alias-label-caption); }
  .pv-composer-inert { opacity: .72; }
  .pv-composer-bar { display: flex; justify-content: space-between; align-items: center; }
  .pv-chip { height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 14px; font-size: 12px; color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-interactive-bg-hover); }
  .pv-send { width: 32px; height: 32px; border-radius: 50%; background: var(--dsw-alias-brand-primary); opacity: .3; }
  .pv-chat { height: 100%; display: flex; flex-direction: column; }
  .pv-chat-top { height: 52px; border-bottom: .5px solid var(--dsw-alias-border-l3); display: flex; align-items: center; padding: 0 20px; font-size: 14px; color: var(--dsw-alias-label-primary); font-weight: 500; flex: none; }
  .pv-messages { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 24px; }
  .pv-msg { width: min(712px, 100%); font-size: 14px; line-height: 24px; color: var(--dsw-alias-label-primary); }
  .pv-msg-user { display: flex; justify-content: flex-end; }
  .pv-msg-user span { background: var(--dsw-alias-interactive-bg-hover); padding: 8px 14px; border-radius: 16px; }
  .pv-done { position: fixed; left: 16px; bottom: 16px; font-size: 12px; color: var(--dsw-alias-label-tertiary); }
  /* A rough DSH settings panel (dsh-client-ui-settings-general): nav on the left, the section in the content column. */
  .pv-settings-mask { position: fixed; inset: 0; background: var(--dsw-alias-bg-mask-1); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .pv-settings { width: min(920px, calc(100vw - 48px)); height: min(760px, calc(100vh - 48px)); display: flex; border-radius: 20px; overflow: hidden; background: var(--dsw-alias-bg-layer-2); box-shadow: var(--dsw-elevation-prominent); }
  .pv-settings-nav { width: 200px; flex: none; padding: 20px 12px; background: var(--dsw-specific-sidebar-fill); border-right: .5px solid var(--dsw-alias-border-l3); }
  .pv-settings-nav h2 { margin: 0 10px 14px; font-size: 16px; font-weight: 500; }
  .pv-settings-item { height: 34px; display: flex; align-items: center; padding: 0 10px; border-radius: 10px; font-size: 14px; color: var(--dsw-alias-label-secondary); }
  .pv-settings-item.on { background: var(--dsw-alias-interactive-bg-active); color: var(--dsw-alias-label-primary); font-weight: 500; }
  .pv-settings-body { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 32px; }
  /* A chat transcript with LongPi's cards in DSH's tool-call rows. */
  .pv-transcript { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 24px; }
  .pv-transcript .pv-msg { width: min(744px, 100%); }
  .pv-callrow { width: min(744px, 100%); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // DATA is filled in by preview/build.mjs (real plugin code against the fake
  // Mirobody) or by preview/dev.mjs (the hand-written fixtures). Anything
  // missing falls back to the fixtures, so the page renders either way.
  const DATA = /*__DATA__*/null
  const params = new URLSearchParams(location.search)
  const VIEW = params.get('view') || 'page'
  const STAGE = params.get('stage')
  if (params.get('theme') === 'dark') document.body.setAttribute('data-ds-dark-theme', '')

  function readSync(path) {
    try {
      const xhr = new XMLHttpRequest()
      xhr.open('GET', path, false)
      xhr.send()
      return xhr.status === 200 ? JSON.parse(xhr.responseText) : null
    } catch { return null }
  }
  const clone = (value) => JSON.parse(JSON.stringify(value))
  const base = {
    journey: (DATA && DATA.journey) || readSync('journey.json') || readSync('fixtures/journey.json'),
    board: (DATA && DATA.board) || readSync('fixtures/board.json'),
    tracking: (DATA && DATA.tracking) || readSync('fixtures/tracking.json'),
    self: (DATA && DATA.self) || readSync('fixtures/self.json') || { rows: [] },
    planDraft: (DATA && DATA.planDraft) || readSync('fixtures/plan-draft.json'),
    followup: (DATA && DATA.followup) || readSync('fixtures/followup.json'),
    indicators: (DATA && DATA.indicators) || readSync('fixtures/indicators.json'),
    connection: (DATA && DATA.connection) || readSync('fixtures/connection.json'),
  }
  // ?tab=: open the page on a tab (the page remembers the tab in localStorage).
  if (params.get('tab')) { try { localStorage.setItem('dsh-plugin-longpi.page-tab', params.get('tab')) } catch {} }
  else { try { localStorage.removeItem('dsh-plugin-longpi.page-tab') } catch {} }
  // Follow-up as a fresh install has it: off, no channel, nothing sent.
  const FOLLOWUP_OFF = {
    settings: { enabled: false, checkin_time: '21:00', retest_time: '09:00', weekly: { day: 7, time: '20:00' }, desktop: true, webhook: null, detail: 'minimal', quiet: null },
    next: { checkin: null, retest: null, weekly: null }, log: [], platform_desktop: true,
  }

  // --- ?stage=: derive a coherent journey, board and tracking for each stage ------------
  const SUGGEST = {
    consent: [['what', 'LongPi 能帮我做什么？'], ['profile', '帮我建立健康档案']],
    profile: [['what', 'LongPi 能帮我做什么？'], ['profile', '帮我建立健康档案']],
    records: [['import', '怎么把体检报告导入 Mirobody？'], ['start', '还没有体检记录，现在可以先做什么？']],
    first_result: [['addons', '下次体检需要加测哪些项目？'], ['now', '用我现有的记录能算出什么？'], ['self', '帮我记录腰围和家庭血压']],
    plan: [['draft', '帮我制定一份改善方案'], ['focus', '我的身体年龄怎么样？哪些指标影响最大？'], ['save', '帮我保存我的干预方案']],
    routine: [['done', '今天的方案我都完成了'], ['effect', '我的方案有没有效果？']],
  }
  const NEXT = {
    consent: ['开始使用 LongPi', '先了解 LongPi 做什么、数据放在哪里。', 'consent'],
    profile: ['建立档案', '填写年龄和性别即可计算身体年龄；再回答 6 个问题可计算心血管风险。', 'profile'],
    records: ['连接体检记录', '在 Mirobody 中生成个人 MCP 地址，重新运行安装命令时加上 --mcp-url。', 'records'],
    first_result: ['还差 2 项检查', '下次体检加测：腰围、超敏C反应蛋白', 'addons'],
    plan: ['制定改善方案', '让 LongPi 按你的检查结果和研究证据起草一份方案，你确认后才保存。', 'plan'],
  }
  function stageData(stage) {
    const journey = clone(base.journey)
    const board = clone(base.board)
    const tracking = clone(base.tracking)
    const planDraft = clone(base.planDraft)
    let followup = clone(base.followup)
    let indicators = clone(base.indicators)
    let connection = clone(base.connection)
    if (!stage || stage === journey.stage) return { journey, board, tracking, planDraft, followup, indicators, connection }
    const order = ['consent', 'profile', 'records', 'first_result', 'plan', 'routine']
    const at = order.indexOf(stage)
    journey.stage = stage
    const [title, detail, action] = NEXT[stage] || NEXT.plan
    journey.next = { stage, title_zh: title, detail_zh: detail, action }
    journey.suggestions = (SUGGEST[stage] || []).map(([id, text]) => ({ id: `${stage}-${id}`, text_zh: text }))
    if (at < 1) journey.consent = { ...journey.consent, accepted: false, accepted_at: null }
    if (at < 2) {
      Object.assign(journey.profile, { displayName: '', birthYear: null, age: null, sex: 'unknown', risk: {}, focus: [], complete: false })
      journey.profile.questions.forEach((row) => { row.answered = false })
    }
    if (at < 3) {
      journey.records = { status: 'unconfigured', error: '', indicator_count: 0, full_checkups: 0, latest_checkup: null, mirobody_mounted: true, read_errors: [], missing_reads: [], summary: null }
      indicators = { record: { status: 'none', error: '' }, updated_at: '', groups: [] }
      connection = { source: 'none', url_masked: '', token_set: false, status: 'none', summary: null }
      journey.changes = []
      journey.self.latest = []
      board.records = { status: 'unconfigured', error: '', indicator_count: 0, indicators: [], medications: [] }
      board.readiness = { ready: [], near: [], unlock: [], declared: board.readiness?.declared ?? 0 }
      board.readouts = []
      board.dispatch = { matches: [], note: '' }
    }
    if (at < 4) {
      const noRecord = at < 3
      const noAge = at < 2
      journey.results.bioage = {
        status: 'blocked', phenoage: null, advance: null, date: null, checkups: 0, band_years: null,
        blocker_zh: noAge ? '档案里还没有实足年龄。' : noRecord ? '还没有连接 Mirobody 记录。' : '记录里还缺超敏C反应蛋白。',
        missing: noRecord ? [] : ['超敏C反应蛋白'],
      }
      journey.results.risk = {
        status: 'blocked', risk_pct: null, category_zh: '', date: null,
        blocker_zh: noAge ? '还需要年龄、性别和 6 个问题的回答。' : noRecord ? '还没有连接 Mirobody 记录；计算还需要血脂、收缩压和腰围。' : '记录里还缺腰围。腰围可以自己在家量。',
        missing_labs: noRecord ? ['总胆固醇', '高密度脂蛋白', '收缩压', '腰围'] : ['腰围'],
        missing_facts: noAge ? ['现在吸烟', '有糖尿病（空腹血糖 ≥7.0 mmol/L 或在用降糖药）', '两周内用过降压药', '住在北方（长江以北）', '住在城市', '父母或兄弟姐妹有心梗或脑卒中'] : [],
      }
      journey.addons = at === 3 ? [
        { item_zh: '腰围', unlocks_zh: '心血管风险', self_measurable: true, self_key: 'waist' },
        { item_zh: '超敏C反应蛋白', unlocks_zh: '身体年龄', self_measurable: false },
      ] : []
      tracking.bioage = { status: noRecord ? 'no_record' : 'missing_inputs', note_zh: journey.results.bioage.blocker_zh, missing: journey.results.bioage.missing, points: [], band_years: null, band_verified: false, band_missing: [], runs: 0 }
    }
    if (at < 5) {
      journey.plan = { exists: false, title: '', version: null, items: 0, started: null, days: null, checkin_items: [], streak: 0, adherence_pct: null }
      journey.reminders = []
      Object.assign(tracking, { status: 'no_plan', plan: null, versions: [], items: [], charts: [], checkins: [], suggestions: at === 4 ? [] : tracking.suggestions.filter(() => false) })
      tracking.models = at === 4 ? tracking.models.map((card) => ({ ...card, goal: null, levers: [], status: 'no_goal' })) : []
      followup = clone(FOLLOWUP_OFF)
      journey.followup = { enabled: false, channels: [], next_at: null }
    }
    return { journey, board, tracking, planDraft, followup, indicators, connection }
  }
  // ?variant=: the real server's edge cases. noaddons = a first result held up
  // only by profile answers (next.action 'profile', no add-ons); recerror = a
  // record that fails with a long message (next.detail_zh past 40 characters);
  // nochanges = nothing moved beyond its band (what most records show);
  // manychanges = three rows for the doctor, so the home line counts the rest.
  // nocheckup = a connected record with no complete checkup yet.
  function variantData(data, variant) {
    const j = data.journey
    if (variant === 'noaddons') {
      const facts = ['住在城市', '父母或兄弟姐妹有心梗或脑卒中']
      delete j.profile.risk.urban
      delete j.profile.risk.family_history

      draft: [['user', '帮我制定一份改善方案'], ['draft_intervention_plan', settled('draft_intervention_plan', {}, { brief: state.planDraft.brief, draft: state.planDraft.draft, how_to_use: '…' })],
        ['text', '按你最关心的身体年龄和心血管，从收录的试验证据里挑了几项，都不涉及处方药。每项注明试验里的平均效果，个人结果会不同。']],
      checkin: [['user', '今天地中海饮食做到了'], ['log_intervention_checkin', settled('log_intervention_checkin', { entries: [{ item: item.title, done: true }] }, { ok: true, saved: 1, entries: [{ at: '2026-09-24T12:00:00.000Z', date: j.today, item: item.id, done: true, amount: null, unit: '', note: '', tags: [], source: 'chat' }], problems: [] })],
        ['text', '记下了。今天的方案都完成了。']],
      save: [['save_intervention_plan', settled('save_intervention_plan', { confirm: false }, { ok: true, saved: false, read_back: readBack, goals: [], warnings: ['「车前子壳纤维」是补充剂类饮食纤维，需先与医生确认，不含剂量。'] })],
        ['save_intervention_plan', settled('save_intervention_plan', { confirm: true }, { ok: true, saved: true, version: 2, read_back: readBack, warnings: [] })]],
      skill: [['run_longevity_skill', settled('run_longevity_skill', { name: 'accelerated-biological-aging-risk' }, { ok: true, skill: 'accelerated-biological-aging-risk', exit_code: 0, measured_at: '2026-08-26', outputs: { phenoage: { value: 44.76, unit: 'a', label_zh: '表型年龄' }, phenoage_advance: { value: -8.14, unit: 'a', label_zh: '表型年龄减实足年龄' } }, report_excerpt: '表型年龄 44.8 岁……边界：模型估计，不是诊断。' })],
        ['run_longevity_skill', settled('run_longevity_skill', { name: 'china-par-ascvd-risk' }, { ok: true, skill: 'china-par-ascvd-risk', exit_code: 0, measured_at: '2026-08-26', outputs: { risk_10y_pct: { value: 4.0, unit: '%', label_zh: '10 年动脉粥样硬化性心血管病风险（China-PAR 模型估计）' }, risk_category: { value: '低危', unit: '', label_zh: '风险分层' } }, report_excerpt: '' })],
        ['run_longevity_skill', settled('run_longevity_skill', { name: 'wearable-aging-clock' }, { ok: true, skill: 'wearable-aging-clock', exit_code: 0, outputs: { wearable_age: { value: 47.2, unit: 'a', label_zh: '可穿戴衰老时钟年龄' } }, report_excerpt: '可穿戴衰老时钟：47.2 岁（模型估计）。' })],
        ['run_longevity_skill', settled('run_longevity_skill', { name: 'proteomic-aging-clock' }, { ok: false, skill: 'proteomic-aging-clock', error_kind: 'missing_input', error: '记录里没有蛋白组学数据', exit_code: 3, report_excerpt: '' })]],
      situation: [['read_personal_situation', settled('read_personal_situation', {}, { indicator_count: j.records.indicator_count, record_status: 'ok', record_changes: (j.changes || []).map(({ points, ...row }) => row), onboarding: { stage: j.stage } })],
        ['draft_intervention_plan', running('draft_intervention_plan', {})],
        ['log_intervention_checkin', settled('log_intervention_checkin', {}, 'log_intervention_checkin: tool timed out after 20000 ms', true)]],
    }
  }
  function ChatCards() {
    const which = params.get('card') || 'draft'
    const rows = which === 'all' ? Object.values(chatCards()).flat() : chatCards()[which] || []
    return h('div', { className: 'pv-chat' },
      h('div', { className: 'pv-chat-top' }, '健康对话'),
      h('div', { className: 'pv-transcript' },
        ...rows.map(([kind, value], index) => kind === 'user' ? h('div', { key: index, className: 'pv-msg pv-msg-user' }, h('span', null, value))
          : kind === 'text' ? h('div', { key: index, className: 'pv-msg' }, value)
          : h('div', { key: index, className: 'pv-callrow' }, h(Seat, { name: 'tool.call.toolview', slotKey: kind, owner: { callId: value.callId, toolName: kind, block: value, openFile: () => {}, loadImage: () => '' } })))),
      h('div', { className: 'pv-composer-seat composerSeat' }, h(ComposerStack, { hero: false, session: true })))
  }
  function SettingsPanel() {
    return h('div', { className: 'pv-settings-mask' },
      h('div', { className: 'pv-settings', role: 'dialog', 'aria-label': '设置' },
        h('nav', { className: 'pv-settings-nav' }, h('h2', null, '设置'),
          ...['通用', '模型', '插件', 'LongPi'].map((label) => h('div', { key: label, className: `pv-settings-item ${label === 'LongPi' ? 'on' : ''}` }, label))),
        h('div', { className: 'pv-settings-body' }, h(Seat, { name: 'settings.section', owner: { close: () => {} } }))))
  }

  // ?tap=suggest clicks the first suggestion pill after load, ?pick=1 then picks a workspace:
  // screenshots of the queued-prompt note and of the prompt landing once a session exists.
  // ?tap=changes follows the home's changes line to the page (which should land on the card).
  if (params.get('tap') === 'changes') {
    setTimeout(() => { const link = document.querySelector('.lp-hero-changes .lp-hero-link'); if (link) link.click() }, 1500)
  }
  // ?tap=task opens the first check-in pill's popover (完成 / 没做到 / 撤销).
  if (params.get('tap') === 'task') {
    setTimeout(() => { const pill = document.querySelector('.lp-task'); if (pill) pill.click() }, 1500)
  }
  if (params.get('tap') === 'suggest') {
    setTimeout(() => {
      const pill = document.querySelector('.lp-suggest')
      if (pill) pill.click()
      if (params.get('pick') === '1') setTimeout(() => { const chip = document.querySelector('.pv-workspace'); if (chip) chip.click() }, 400)
    }, 1500)
  }

  function App() {
    const [view, set] = React.useState(VIEW)
    setView = set
    const [done, setDone] = React.useState(false)
    let main
    if (view === 'page') main = h(Seat, { name: 'main' })
    else if (view === 'home') main = h(Hero)
    else if (view === 'onboarding') main = h(Hero)
    else if (view === 'chat') main = h(ChatCards)
    else if (view === 'settings') main = h(Hero)
    else main = h(Chat)
    const step = params.get('step')
    return h('div', { className: 'pv-frame' },
      params.get('chrome') === '0' ? null : h(Sidebar, { active: view === 'page' }),
      h('main', { className: 'pv-main' },
        main,
        h('div', { className: 'pv-overlay', 'data-shell-overlay': true }, view === 'pill' ? h(Seat, { name: 'shell.overlay' }) : null)),
      view === 'onboarding' && !done ? h(Seat, {
        name: 'settings.onboarding',
        owner: { stepId: 'longpi', complete: () => setDone(true), openSection: () => {}, initialStep: step ? Number(step) - 1 : undefined, explicit: params.get('explicit') === '1' },
      }) : null,
      view === 'settings' ? h(SettingsPanel) : null,
      done ? h('div', { className: 'pv-done' }, 'onboarding complete()') : null)
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App))
</script>
</body>
</html>
