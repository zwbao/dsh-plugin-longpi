<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="LongPi dashboard: composite biological age 41.2 versus chronological 45">
  <rect width="1280" height="720" fill="#F5F1EA"/>
  <rect x="48" y="40" width="1184" height="640" rx="24" fill="#FCFAF5" stroke="#E6DFCF"/>
  <text x="80" y="88" fill="#B8935A" font-family="Georgia, 'Iowan Old Style', serif" font-size="14" letter-spacing="3">DEMO DATA · NOT A PERSONAL CHART</text>
