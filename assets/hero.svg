    <text x="20" y="36" fill="#6B7370" font-size="13" font-family="Georgia, serif">Physiological</text>
    <text x="20" y="78" fill="#1A1F1D" font-size="32" font-family="Georgia, serif">39.8</text>
  </g>
  <g transform="translate(520,360)">
    <rect width="200" height="112" rx="14" fill="#FFFFFF" stroke="#E6DFCF"/>
    <text x="20" y="36" fill="#6B7370" font-size="13" font-family="Georgia, serif">Psychological</text>
    <text x="20" y="78" fill="#1A1F1D" font-size="32" font-family="Georgia, serif">42.0</text>
