    <text x="20" y="36" fill="#6B7370" font-size="13" font-family="Georgia, serif">Social / env</text>
    <text x="20" y="78" fill="#1A1F1D" font-size="32" font-family="Georgia, serif">41.6</text>
  </g>

  <g transform="translate(860,200)">
    <circle cx="160" cy="170" r="150" fill="none" stroke="#E6DFCF"/>
    <circle cx="160" cy="170" r="100" fill="none" stroke="#C7D9D5"/>
